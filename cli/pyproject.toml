[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gt-cli"
version = "0.1.0"
description = "GT (GlobeTrotter) command-line client"
requires-python = ">=3.10"
dependencies = [
    "typer==0.16.1",
    "requests==2.32.3",
    "rich==13.7.1",
]

[project.scripts]
gt = "gt_cli.main:app"

[tool.setuptools.packages.find]
include = ["gt_cli*"]
